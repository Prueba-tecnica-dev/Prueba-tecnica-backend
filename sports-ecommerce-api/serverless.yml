service: sports-ecommerce-api

provider:
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 30
  environment:
    NODE_ENV: ${env:NODE_ENV, 'development'}
    AWS_REGION: ${env:AWS_REGION, 'us-east-1'}
    DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, 'http://localhost:8000'}
    JWT_SECRET: ${env:JWT_SECRET, 'development-secret'}
    JWT_EXPIRES_IN: ${env:JWT_EXPIRES_IN, '1h'}
    SMTP_HOST: ${env:SMTP_HOST, ''}
    SMTP_PORT: ${env:SMTP_PORT, '587'}
    SMTP_USER: ${env:SMTP_USER, ''}
    SMTP_PASSWORD: ${env:SMTP_PASSWORD, ''}
    SMTP_FROM: ${env:SMTP_FROM, ''}

plugins:
  - serverless-offline
  - serverless-esbuild

custom:
  serverless-offline:
    httpPort: 3000
    lambdaPort: 4000
    noPrependStageInUrl: true
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    format: cjs
    target: node20

functions:
  index:
    handler: src/handlers/index.handler
    events:
      - http:
          path: /
          method: get
          cors: true

  register:
    handler: src/handlers/auth.handler
    events:
      - http:
          path: /api/auth/register
          method: post
          cors: true

  login:
    handler: src/handlers/auth.handler
    events:
      - http:
          path: /api/auth/login
          method: post
          cors: true

  products:
    handler: src/handlers/products.handler
    events:
      - http:
          path: /api/products
          method: get
          cors: true

  addToCart:
    handler: src/handlers/cart.handler
    events:
      - http:
          path: /api/cart
          method: post
          cors: true

  getCart:
    handler: src/handlers/cart.handler
    events:
      - http:
          path: /api/cart
          method: get
          cors: true

  removeFromCart:
    handler: src/handlers/cart.handler
    events:
      - http:
          path: /api/cart/{productId}
          method: delete
          cors: true

  checkout:
    handler: src/handlers/checkout.handler
    events:
      - http:
          path: /api/checkout
          method: post
          cors: true

  purchases:
    handler: src/handlers/purchases.handler
    events:
      - http:
          path: /api/purchases
          method: get
          cors: true

  me:
    handler: src/handlers/auth.handler
    events:
      - http:
          path: /api/me
          method: get
          cors: true
